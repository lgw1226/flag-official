defaults:
  - _self_
  - actor: flag_actor
  - critic: crossq_distributional_critic
  - alpha: default
  - optim@_global_: default

seed: 42

# environment parameters
env_id: null
normalize_env: false
normalize_obs: true
normalize_reward: false
normalize_reward_eval: false
normalize_gamma: ${discount}
normalize_clip_obs: 10.0
normalize_clip_reward: 10.0
normalize_eps: 1e-8
discount: 0.99

# critic parameters
critic_ema_rate: 0.005
ent_coeff: 0.005  # for entropy regularization of distributional critic

# training parameters
total_steps: 1000001
start_steps: 10000
log_interval: 100
eval_interval: 10000
eval_episodes: 5
eta: 0.1
utd: 2
policy_delay: 3
alpha_target_entropy_coeff: -1.0

# FLAG specific parameters
supervision_coef_max: 1.0
supervision_warmup_steps: 100000
supervision_ramp_steps: 100000

logstd_min: -3.0
logstd_scheduler: exponential  # linear std interpolation
logstd_warmup_steps: 200000
logstd_decay_steps: 800000

buffer:
  _target_: flag.buffers.ReplayBuffer
  size: 1000000
  batch_size: 256

guidance_buffer:
  _target_: flag.buffers.GuidanceBuffer
  size: 10240
  batch_size: 256

# checkpointing
ckpt_dir: checkpoints/${env_id}/N${actor.num_train_action_samples}/seed${seed}
ckpt_interval: 100000  # env steps; 0 to disable. Phase 1 keeps 10 checkpoints per 1M-step run
resume: null  # "latest", or a path to a step_*.pkl

# WandB (for logging)
wandb:
  project: FLAG
  name: ${env_id}-N${actor.num_train_action_samples}-seed${seed}
  mode: offline

# diagnostics (plan.md Part II–V + phase1_plan.md §2); off by default
diag:
  enabled: false
  light_every: 10          # env steps between light logs (deliberate deviation from
                           # plan's "every actor update" — cost control; Phase 0 measured
                           # this density as sufficient)
  drift_probe_batch: 128
  probe_batch: 128         # phase-0 only (heavy_probe); probe_interval=0 disables
  n_ref: 128               # used by heavy_probe and the shadow reference target
  probe_interval: 0        # env steps; 0 = off (phase-1 default, phase1_plan §5.1)
  staleness_interval: 0    # env steps; 0 = off (phase-1 drops age bins, §2.3)
  staleness_per_bin: 32
  shadow_interval: 100000  # phase1_plan §2.5
  shadow_batch: 128
  shadow_seeds: [0, 1, 2]  # heavy KL/BPTT shadow only on these seeds (§1)
